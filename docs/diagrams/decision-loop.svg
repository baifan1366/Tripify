<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-loop-title tripify-loop-desc">
      <title id="tripify-loop-title">The Tripify decision loop</title>
      <desc id="tripify-loop-desc">Six stations — discuss, research, recommend, propose, vote, replan — run clockwise, and every pass writes back to one shared, versioned trip state at the center.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Ring arcs (clockwise, R=240, C=520,340) -->
      <path d="M 600.0,113.7 A 240 240 0 0 1 705.0,189.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 743.3,252.0 A 240 240 0 0 1 743.8,426.8" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 705.7,491.8 A 240 240 0 0 1 601.3,565.8" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 440.0,566.2 A 240 240 0 0 1 297.2,429.1" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 296.7,428.0 A 240 240 0 0 1 296.2,253.2" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 334.3,188.0 A 240 240 0 0 1 438.7,114.2" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Dashed write-back spokes -->
      <line x1="520" y1="132" x2="520" y2="282" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="672.4" y1="252" x2="615.3" y2="285" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="672.4" y1="428" x2="615.3" y2="395" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="520" y1="548" x2="520" y2="398" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="367.6" y1="428" x2="424.7" y2="395" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="367.6" y1="252" x2="424.7" y2="285" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- Station 0: Discuss (top) -->
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discuss</text>
      <text x="520" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">group chat · AI teammate</text>

      <!-- Station 1: Research -->
      <rect x="647.8" y="188" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="647.8" y="188" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="727.8" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Research</text>
      <text x="727.8" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web · places · reviews</text>

      <!-- Station 2: Recommend -->
      <rect x="647.8" y="428" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="647.8" y="428" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="727.8" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recommend</text>
      <text x="727.8" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">group-fit scoring</text>

      <!-- Station 3: Propose (focal) -->
      <rect x="440" y="548" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="548" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="520" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Propose</text>
      <text x="520" y="592" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rationale · diff · impact</text>

      <!-- Station 4: Vote -->
      <rect x="312.2" y="428" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="312.2" y="428" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="392.2" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vote</text>
      <text x="392.2" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">approve · modify · reject</text>

      <!-- Station 5: Replan -->
      <rect x="312.2" y="188" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="312.2" y="188" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="392.2" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replan</text>
      <text x="392.2" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">adapts to reality</text>

      <!-- Hub -->
      <rect x="420" y="288" width="200" height="104" rx="6" fill="#2d3142"/>
      <text x="520" y="332" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trip State</text>
      <text x="520" y="350" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">versioned itinerary</text>
      <text x="520" y="364" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">budget · votes</text>

      <!-- Legend -->
      <line x1="40" y1="648" x2="1000" y2="648" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="112" y1="664" x2="140" y2="664" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="148" y="667" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Group flow (clockwise)</text>
      <line x1="300" y1="664" x2="328" y2="664" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="336" y="667" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Writes back to shared trip state</text>
    </svg>