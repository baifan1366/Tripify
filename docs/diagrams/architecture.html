<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tripify System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Tripify</p>
    <h1>System Architecture</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-arch-title tripify-arch-desc">

      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="208" y="453" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL APIS</text>

      <text x="532" y="135" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS</text>

      <path d="M 420,240 V 272 Q 420,280 412,280 H 248 Q 240,280 240,288 V 316"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="324" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL · RLS</text>

      <text x="66" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REALTIME</text>

      <rect x="388" y="46" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="406" y="55" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="500" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tripify UI</text>
      <text x="500" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat · itinerary · map · budget</text>

      <!-- Next.js backend -->
      <rect x="340" y="160" width="320" height="80" rx="6" fill="#f5f5f5"/>

      <!-- AI Agent (focal) -->
      <rect x="660" y="320" width="200" height="72" rx="6" fill="#f5f5f5"/>

      <text x="760" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">research · recommend · replan</text>

      <!-- External nodes -->
      <rect x="144" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>

      <text x="224" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google Places</text>
      <text x="224" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">places · reviews</text>

      <rect x="328" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="472" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="336" y="478" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="352" y="487" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="408" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google Routes</text>
      <text x="408" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">travel times</text>

      <rect x="512" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="472" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="520" y="478" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="536" y="487" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="592" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open-Meteo</text>
      <text x="592" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weather forecasts</text>

      <rect x="696" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="472" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="704" y="478" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="722" y="487" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="776" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web Search</text>
      <text x="776" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reddit · guides</text>

      <!-- Legend -->
      <line x1="30" y1="652" x2="970" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="104" y="664" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <rect x="352" y="664" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="376" y="673" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">AI agent</text>
      <rect x="456" y="664" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="673" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">External API</text>
      <line x1="588" y1="670" x2="616" y2="670" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="624" y="673" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Realtime sync</text>
      <line x1="728" y1="670" x2="756" y2="670" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="764" y="673" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tool calls</text>
    </svg>
  </div>
</body>
</html>
