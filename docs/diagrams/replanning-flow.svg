<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-replan-title tripify-replan-desc">
      <title id="tripify-replan-title">Dynamic replanning flow</title>
      <desc id="tripify-replan-desc">When a real-world event hits, the AI detects affected activities, researches alternatives, and issues a backup proposal; the group votes, an approved proposal becomes the next itinerary version, and a rejected one loops back as a compromise.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows -->
      <line x1="420" y1="84" x2="420" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="172" x2="420" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="256" x2="420" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="340" x2="420" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="540" y1="420" x2="636" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="404" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="413" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <line x1="420" y1="452" x2="420" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="430" y="464" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="444" y="473" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <line x1="750" y1="444" x2="750" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Compromise loop back to proposal -->
      <path d="M 290,520 H 220 Q 212,520 212,512 V 324 Q 212,316 220,316 H 286"
            fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Start oval -->
      <rect x="300" y="40" width="240" height="44" rx="22" fill="#f5f5f5"/>
      <rect x="300" y="40" width="240" height="44" rx="22" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="420" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Real-World Event</text>

      <!-- Steps -->
      <rect x="290" y="124" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="124" width="260" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Detects Affected Activities</text>

      <rect x="300" y="208" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="208" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Researches Alternatives</text>

      <rect x="290" y="292" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="292" width="260" height="48" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="420" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backup Proposal + Rationale</text>

      <!-- Decision diamond -->
      <polygon points="420,388 540,420 420,452 300,420" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Approved?</text>

      <!-- Yes branch -->
      <rect x="640" y="396" width="220" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="396" width="220" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="750" y="418" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Itinerary v+1 Applied</text>
      <text x="750" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">full version control</text>

      <!-- No branch -->
      <rect x="290" y="496" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="496" width="260" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Proposes Compromise</text>
      <text x="228" y="508" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVISE</text>

      <!-- End oval -->
      <rect x="650" y="500" width="200" height="44" rx="22" fill="#f5f5f5"/>
      <rect x="650" y="500" width="200" height="44" rx="22" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="750" y="526" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trip Continues</text>
    </svg>