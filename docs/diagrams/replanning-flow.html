<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Replanning Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-replan-title tripify-replan-desc">
      <title id="tripify-replan-title">Dynamic replanning flow</title>
      <desc id="tripify-replan-desc">When a real-world event hits, the AI detects affected activities, researches alternatives, and issues a backup proposal; the group votes, an approved proposal becomes the next itinerary version, and a rejected one loops back as a compromise.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows -->
      <line x1="420" y1="84" x2="420" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="172" x2="420" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="256" x2="420" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="340" x2="420" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="540" y1="420" x2="636" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="404" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="416" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <line x1="420" y1="452" x2="420" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="430" y="464" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="448" y="476" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <line x1="750" y1="444" x2="750" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Compromise loop back to proposal -->
      <path d="M 290,520 H 220 Q 212,520 212,512 V 324 Q 212,316 220,316 H 286"
            fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Start oval -->
      <rect x="300" y="40" width="240" height="44" rx="22" fill="#f5f5f5"/>
      <rect x="300" y="40" width="240" height="44" rx="22" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="420" y="68" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Real-World Event</text>

      <!-- Steps -->
      <rect x="290" y="124" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="124" width="260" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="154" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Detects Affected Activities</text>

      <rect x="300" y="208" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="208" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="238" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Researches Alternatives</text>

      <rect x="290" y="292" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="292" width="260" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="420" y="322" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backup Proposal + Rationale</text>

      <!-- Decision diamond -->
      <polygon points="420,388 540,420 420,452 300,420" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="426" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Approved?</text>

      <!-- Yes branch -->
      <rect x="640" y="396" width="220" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="396" width="220" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="750" y="418" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Itinerary v+1 Applied</text>
      <text x="750" y="436" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">full version control</text>

      <!-- No branch -->
      <rect x="290" y="496" width="260" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="496" width="260" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="526" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Proposes Compromise</text>
      <text x="224" y="510" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVISE</text>

      <!-- End oval -->
      <rect x="650" y="500" width="200" height="44" rx="22" fill="#f5f5f5"/>
      <rect x="650" y="500" width="200" height="44" rx="22" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="750" y="528" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trip Continues</text>
    </svg>
  </div>
</body>
</html>
