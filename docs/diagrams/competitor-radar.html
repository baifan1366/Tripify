<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tripify vs Existing Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Radar · Tripify</p>
    <h1>Tripify vs Existing Tools</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-radar-title tripify-radar-desc">
      <title id="tripify-radar-title">Tripify compared with existing travel tools</title>
      <desc id="tripify-radar-desc">Across five capabilities — group decisions, AI research, shared context, dynamic replanning, and itinerary planning — only Tripify scores high on all five; Google Travel, TripIt, and ChatGPT each cover at most itinerary planning and research.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Grid rings (0.2 / 0.4 / 0.6 / 0.8 inner, 1.0 outer) -->
      <polygon points="500,208 530,230 519,266 481,266 470,230" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <polygon points="500,176 561,220 538,292 462,292 439,220" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <polygon points="500,144 591,211 556,317 444,317 409,211" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <polygon points="500,112 622,201 575,343 425,343 378,201" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <polygon points="500,80 652,191 594,369 406,369 348,191" fill="none" stroke="#bfc0c0" stroke-opacity="0.20" stroke-width="1"/>

      <!-- Axis spokes -->
      <line x1="500" y1="240" x2="500" y2="80" stroke="#bfc0c0" stroke-opacity="0.20" stroke-width="1"/>
      <line x1="500" y1="240" x2="652" y2="191" stroke="#bfc0c0" stroke-opacity="0.20" stroke-width="1"/>
      <line x1="500" y1="240" x2="594" y2="369" stroke="#bfc0c0" stroke-opacity="0.20" stroke-width="1"/>
      <line x1="500" y1="240" x2="406" y2="369" stroke="#bfc0c0" stroke-opacity="0.20" stroke-width="1"/>
      <line x1="500" y1="240" x2="348" y2="191" stroke="#bfc0c0" stroke-opacity="0.20" stroke-width="1"/>

      <!-- Axis labels -->
      <text x="500" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Group Decisions</text>
      <text x="668" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">AI Research</text>
      <text x="610" y="388" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Dynamic Replanning</text>
      <text x="390" y="388" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Shared Context</text>
      <text x="332" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Itinerary Planning</text>

      <!-- Scale ticks on top axis -->
      <text x="494" y="211" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">2</text>
      <text x="494" y="179" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">4</text>
      <text x="494" y="147" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">6</text>
      <text x="494" y="115" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">8</text>
      <text x="494" y="83" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">10</text>

      <!-- Non-focal series (smallest first) -->
      <polygon points="500,224 515,235 528,279 444,317 409,211"
               fill="rgba(185,145,90,0.18)" stroke="#b8915a" stroke-width="1.5"/>
      <polygon points="500,208 606,206 528,279 481,266 394,211"
               fill="rgba(94,122,155,0.18)" stroke="#5e7a9b" stroke-width="1.5"/>
      <polygon points="500,208 591,211 519,266 434,330 394,211"
               fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1.5"/>

      <!-- Focal series: Tripify -->
      <polygon points="500,96 637,196 575,343 415,356 363,196"
               fill="rgba(235,108,54,0.18)" stroke="#eb6c36" stroke-width="1.8"/>
      <circle cx="500" cy="96" r="4" fill="#eb6c36"/>
      <circle cx="637" cy="196" r="4" fill="#eb6c36"/>
      <circle cx="575" cy="343" r="4" fill="#eb6c36"/>
      <circle cx="415" cy="356" r="4" fill="#eb6c36"/>
      <circle cx="363" cy="196" r="4" fill="#eb6c36"/>

      <!-- Legend -->
      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="456" width="16" height="8" fill="rgba(235,108,54,0.18)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="64" y="464" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tripify</text>
      <rect x="160" y="456" width="16" height="8" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1.5"/>
      <text x="184" y="464" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Google Travel</text>
      <rect x="296" y="456" width="16" height="8" fill="rgba(94,122,155,0.18)" stroke="#5e7a9b" stroke-width="1.5"/>
      <text x="320" y="464" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">ChatGPT / Notion AI</text>
      <rect x="472" y="456" width="16" height="8" fill="rgba(185,145,90,0.18)" stroke="#b8915a" stroke-width="1.5"/>
      <text x="496" y="464" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">TripIt</text>
      <text x="960" y="464" fill="#7a8399" font-size="10" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="end">Only Tripify covers all five.</text>
    </svg>
  </div>
</body>
</html>
