<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-gantt-title tripify-gantt-desc">
      <title id="tripify-gantt-title">Build plan, twelve phases over eighteen days</title>
      <desc id="tripify-gantt-desc">Twelve build phases from foundation to polish across eighteen days; the proposal system — the core differentiator — is the critical-path phase in the second half of the plan.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Time axis: x = 200 + (day-1)*40, 18 days -> 920 -->
      <text x="200" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">D1</text>
      <text x="320" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">D4</text>
      <text x="440" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">D7</text>
      <text x="560" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">D10</text>
      <text x="680" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">D13</text>
      <text x="800" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">D16</text>
      <line x1="200" y1="64" x2="920" y2="64" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>

      <!-- Rows: y = 80 + i*40 -->
      <!-- P1 Foundation D1 -->
      <text x="196" y="105" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Foundation</text>
      <rect x="200" y="88" width="32" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="216" y="104" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1d</text>

      <!-- P2 Auth D2 -->
      <text x="196" y="145" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Auth</text>
      <rect x="240" y="128" width="32" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="256" y="144" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1d</text>

      <!-- P3 Trip core D3-4 -->
      <text x="196" y="185" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Trip core</text>
      <rect x="280" y="168" width="72" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="316" y="184" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2d</text>

      <!-- P4 Itinerary D5-6 -->
      <text x="196" y="225" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Itinerary</text>
      <rect x="360" y="208" width="72" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="396" y="224" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2d</text>

      <!-- P5 Maps D7 -->
      <text x="196" y="265" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Maps</text>
      <rect x="440" y="248" width="32" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="456" y="264" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1d</text>

      <!-- P6 Chat D8 -->
      <text x="196" y="305" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Chat</text>
      <rect x="480" y="288" width="32" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="496" y="304" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1d</text>

      <!-- P7 AI context D9 -->
      <text x="196" y="345" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">AI context</text>
      <rect x="520" y="328" width="32" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="536" y="344" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1d</text>

      <!-- P8 AI tools D10-11 -->
      <text x="196" y="385" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">AI tools</text>
      <rect x="560" y="368" width="72" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="596" y="384" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2d</text>

      <!-- P9 Proposal system D12-13 (focal) -->
      <text x="196" y="425" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Proposal system ★</text>
      <rect x="640" y="408" width="72" height="24" rx="4" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="1"/>
      <text x="676" y="424" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2d</text>

      <!-- P10 Research & recs D14-15 -->
      <text x="196" y="465" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Research &amp; recs</text>
      <rect x="720" y="448" width="72" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="756" y="464" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2d</text>

      <!-- P11 Replanning D16 -->
      <text x="196" y="505" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Replanning</text>
      <rect x="800" y="488" width="32" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="816" y="504" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1d</text>

      <!-- P12 Polish & demo D17-18 -->
      <text x="196" y="545" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Polish &amp; demo</text>
      <rect x="840" y="528" width="72" height="24" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="876" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2d</text>

      <!-- Legend -->
      <line x1="20" y1="580" x2="960" y2="580" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="20" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="88" y="592" width="16" height="10" rx="2" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="112" y="601" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Build phase</text>
      <rect x="200" y="592" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="1"/>
      <text x="224" y="601" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Core differentiator (proposal system)</text>
    </svg>