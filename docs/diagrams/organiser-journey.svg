<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-journey-title tripify-journey-desc">
      <title id="tripify-journey-title">The organiser's journey</title>
      <desc id="tripify-journey-desc">The trip organiser moves from creating the trip, through group discussion and voting, into a disruption that dips sentiment, and recovers when the group replans together.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Stage headers: col_left = 64 + i*224 -->
      <text x="164" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1</text>
      <text x="164" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create Trip</text>
      <text x="388" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 2</text>
      <text x="388" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discuss Together</text>
      <text x="612" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 3</text>
      <text x="612" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vote Proposals</text>
      <text x="836" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 4</text>
      <text x="836" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hit a Delay</text>
      <text x="1060" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 5</text>
      <text x="1060" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replan &amp; Travel</text>

      <!-- Sentiment band: 120..280, hairlines at 120 (HIGH), 200 (NEUTRAL), 280 (LOW) -->
      <line x1="64" y1="120" x2="1136" y2="120" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <line x1="64" y1="200" x2="1136" y2="200" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <line x1="64" y1="280" x2="1136" y2="280" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="116" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">HIGH</text>
      <text x="116" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">NEUTRAL</text>
      <text x="116" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">LOW</text>

      <!-- Sentiment curve: NEUTRAL, HIGH, HIGH, LOW, HIGH -->
      <polyline points="164,200 388,120 612,120 836,280 1060,120"
                fill="none" stroke="#4f5d75" stroke-width="1.5"/>
      <!-- Trough segment + dot in accent -->
      <line x1="612" y1="120" x2="836" y2="280" stroke="#eb6c36" stroke-width="1.5"/>
      <line x1="836" y1="280" x2="1060" y2="120" stroke="#eb6c36" stroke-width="1.5"/>
      <circle cx="836" cy="280" r="5" fill="#eb6c36"/>
      <circle cx="164" cy="200" r="5" fill="#4f5d75"/>
      <circle cx="388" cy="120" r="5" fill="#4f5d75"/>
      <circle cx="612" cy="120" r="5" fill="#4f5d75"/>
      <circle cx="1060" cy="120" r="5" fill="#4f5d75"/>

      <!-- Actions row -->
      <line x1="64" y1="320" x2="1136" y2="320" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="116" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">ACTIONS</text>
      <text x="164" y="344" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">set destination, dates, budget</text>
      <text x="388" y="344" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">chat; AI researches &amp; recommends</text>
      <text x="612" y="344" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">approve / modify / reject</text>
      <text x="836" y="344" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">flight delayed, rain on Day 3</text>
      <text x="1060" y="344" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">vote on backup proposal</text>

      <!-- Pain marker (trough only) -->
      <rect x="756" y="356" width="160" height="16" rx="2" fill="#eb6c36" fill-opacity="0.05"
            stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="836" y="367" fill="#eb6c36" fill-opacity="0.80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLANS BREAK</text>

      <!-- Touchpoints row -->
      <line x1="64" y1="396" x2="1136" y2="396" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="116" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TOUCHPOINTS</text>
      <text x="164" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trip setup wizard</text>
      <text x="388" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">group chat + TripMate AI</text>
      <text x="612" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proposal card + vote panel</text>
      <text x="836" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">smart alert</text>
      <text x="1060" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backup proposal + diff</text>

      <!-- Legend -->
      <line x1="64" y1="452" x2="1136" y2="452" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="64" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="136" y1="468" x2="164" y2="468" stroke="#4f5d75" stroke-width="1.5"/>
      <circle cx="150" cy="468" r="4" fill="#4f5d75"/>
      <text x="172" y="471" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Sentiment curve</text>
      <line x1="284" y1="468" x2="312" y2="468" stroke="#eb6c36" stroke-width="1.5"/>
      <circle cx="298" cy="468" r="4" fill="#eb6c36"/>
      <text x="320" y="471" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Trough stage (the disruption)</text>
      <rect x="520" y="460" width="16" height="14" rx="2" fill="#eb6c36" fill-opacity="0.05" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="544" y="471" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Pain marker</text>
    </svg>