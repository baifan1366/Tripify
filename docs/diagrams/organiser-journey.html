<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Organiser's Journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripify-journey-title tripify-journey-desc">
      <title id="tripify-journey-title">The organiser's journey</title>
      <desc id="tripify-journey-desc">The trip organiser moves from creating the trip, through group discussion and voting, into a disruption that dips sentiment, and recovers when the group replans together.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Stage headers: col_left = 64 + i*224 -->
      <text x="164" y="50" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1</text>
      <text x="164" y="76" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create Trip</text>
      <text x="388" y="50" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 2</text>
      <text x="388" y="76" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discuss Together</text>
      <text x="612" y="50" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 3</text>
      <text x="612" y="76" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vote Proposals</text>
      <text x="836" y="50" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 4</text>
      <text x="836" y="76" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hit a Delay</text>
      <text x="1060" y="50" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 5</text>
      <text x="1060" y="76" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replan &amp; Travel</text>

      <!-- Sentiment band: 140..300, hairlines at 140 (HIGH), 220 (NEUTRAL), 300 (LOW) -->
      <line x1="64" y1="140" x2="1136" y2="140" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="220" x2="1136" y2="220" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="300" x2="1136" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="116" y="144" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="end">HIGH</text>
      <text x="116" y="224" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="end">NEUTRAL</text>
      <text x="116" y="304" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="end">LOW</text>

      <!-- Sentiment curve: NEUTRAL, HIGH, HIGH, LOW, HIGH -->
      <polyline points="164,220 388,140 612,140 836,300 1060,140"
                fill="none" stroke="#4f5d75" stroke-width="2"/>
      <!-- Trough segment + dot in accent -->
      <line x1="612" y1="140" x2="836" y2="300" stroke="#eb6c36" stroke-width="2"/>
      <line x1="836" y1="300" x2="1060" y2="140" stroke="#eb6c36" stroke-width="2"/>
      <circle cx="836" cy="300" r="6" fill="#eb6c36"/>
      <circle cx="164" cy="220" r="6" fill="#4f5d75"/>
      <circle cx="388" cy="140" r="6" fill="#4f5d75"/>
      <circle cx="612" cy="140" r="6" fill="#4f5d75"/>
      <circle cx="1060" cy="140" r="6" fill="#4f5d75"/>

      <!-- Actions row -->
      <line x1="64" y1="380" x2="1136" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="50" y="408" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">ACTIONS</text>
      
      <text x="164" y="438" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">set destination,</text>
      <text x="164" y="460" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">dates, budget</text>
      
      <text x="388" y="438" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">chat; AI researches</text>
      <text x="388" y="460" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">&amp; recommends</text>
      
      <text x="612" y="438" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">approve / modify</text>
      <text x="612" y="460" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">/ reject</text>
      
      <text x="836" y="438" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">flight delayed,</text>
      <text x="836" y="460" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">rain on Day 3</text>
      
      <text x="1060" y="438" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">vote on backup</text>
      <text x="1060" y="460" fill="#2d3142" font-size="18" font-family="'Geist', sans-serif" text-anchor="middle">proposal</text>

      <!-- Pain marker (trough only) -->
      <rect x="756" y="478" width="160" height="22" rx="3" fill="rgba(235,108,54,0.05)"
            stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="836" y="494" fill="rgba(235,108,54,0.80)" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLANS BREAK</text>

      <!-- Touchpoints row -->
      <line x1="64" y1="530" x2="1136" y2="530" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="50" y="558" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">TOUCHPOINTS</text>
      
      <text x="164" y="588" fill="#4f5d75" font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">trip setup wizard</text>
      <text x="388" y="588" fill="#4f5d75" font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">group chat + TripMate AI</text>
      <text x="612" y="588" fill="#4f5d75" font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">proposal card + vote panel</text>
      <text x="836" y="588" fill="#4f5d75" font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">smart alert</text>
      <text x="1060" y="588" fill="#4f5d75" font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">backup proposal + diff</text>

      <!-- Legend -->
      <line x1="64" y1="620" x2="1136" y2="620" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="648" fill="#4f5d75" font-size="15" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      
      <line x1="150" y1="672" x2="182" y2="672" stroke="#4f5d75" stroke-width="2"/>
      <circle cx="166" cy="672" r="5" fill="#4f5d75"/>
      <text x="192" y="676" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">Sentiment curve</text>
      
      <line x1="340" y1="672" x2="372" y2="672" stroke="#eb6c36" stroke-width="2"/>
      <circle cx="356" cy="672" r="5" fill="#eb6c36"/>
      <text x="382" y="676" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">Trough stage (the disruption)</text>
      
      <rect x="650" y="664" width="20" height="18" rx="3" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="678" y="676" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">Pain marker</text>
    </svg>
  </div>
</body>
</html>
